# Fly.io deployment for the PDF -> DOCX converter.
#
# Sized for the workload rather than the defaults: LibreOffice holding a
# document model plus a JVM does not fit in the 256 MB shared tier, and an
# OOM-killed conversion looks to the user like a broken tool.

app = "warytools-pdf-converter"
primary_region = "bom"          # Mumbai — closest to the site's main audience.

[build]
  dockerfile = "Dockerfile"

[env]
  # Set explicitly rather than relying on the image default. The Dockerfile
  # defaults to 7860 (what Hugging Face Spaces routes to); server.mjs reads
  # PORT either way, so the image runs unmodified on both — but internal_port
  # below must match whatever this says, or Fly health-checks a dead port.
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true

  # Scale to zero when idle. This service is bursty — paying for an always-on
  # machine to serve occasional conversions is the wrong trade. The cost is a
  # cold start on the first request after a quiet spell, which the client UI
  # accounts for by allowing a generous timeout.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  # There is no max-machines key in fly.toml — the ceiling is set out of band
  # with `fly scale count 1`, which the README's deploy steps include. Worth
  # doing: without it a traffic spike is discovered on the invoice, and one
  # machine is enough for this workload.

  # Deliberately set so a burst QUEUES on one machine rather than starting a
  # second one. Fly bills per machine-second, so autoscaling on a free-to-use
  # tool means traffic spikes translate directly into a bill nobody approved.
  # server.mjs already queues internally (MAX_CONCURRENT=2) and the rate
  # limiter caps abuse, so the realistic worst case is a short wait rather
  # than a failure. Raise soft_limit only if real usage justifies the spend.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 4
    hard_limit = 8

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
